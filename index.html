<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pepegotchi</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #142016; color: #172016; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .shell { width: min(94vw, 380px); background: #d7d2c8; border-radius: 42px 42px 64px 64px; padding: 18px 16px 22px; box-shadow: inset 0 0 0 3px #1b1b1b; }
  .brand { text-align: center; font-weight: 800; letter-spacing: 2px; font-size: 13px; margin-bottom: 8px; }
  .screen { background: #9ad07a; border: 6px solid #2c2c2c; border-radius: 16px; padding: 8px; }
  .screen.asleep { background: #1c2430; } .screen.dead { background: #2c3338; }
  svg { width: 100%; height: 280px; display: block; }
  .readout { display: flex; justify-content: space-between; font-size: 11px; margin-top: 8px; }
  .btns, .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  button { border: 2px solid #1b1b1b; background: #f4f1ea; border-radius: 999px; padding: 8px 10px; font: inherit; font-size: 12px; }
  button.on { background: #1b3a1a; color: #f4ffe8; }
  h2 { font-size: 12px; margin: 14px 0 0; }
  .log { font-size: 12px; line-height: 1.4; min-height: 36px; margin-top: 8px; }
</style>
</head>
<body>
<div class="shell">
  <div class="brand">PEPEGOTCHI</div>
  <div class="screen" id="screen"></div>
  <div class="readout" id="readout"></div>
  <div class="btns">
    <button data-act="meal">Meal</button>
    <button data-act="snack">Snack</button>
    <button data-act="play">Play</button>
    <button data-act="bath">Bath</button>
    <button data-act="lights">Lights</button>
    <button data-act="reset">Reset</button>
  </div>
  <h2>Clothes</h2>
  <div class="row" id="clothes">
    <button data-outfit="0">none</button><button data-outfit="1">cap</button>
    <button data-outfit="2">hoodie</button><button data-outfit="3">scarf</button><button data-outfit="4">bow</button>
  </div>
  <h2>Toys</h2>
  <div class="row" id="toys">
    <button data-toy="0">none</button><button data-toy="1">ball</button>
    <button data-toy="2">duck</button><button data-toy="3">skateboard</button>
  </div>
  <div class="log" id="log">Bars are the game. Play drops Bored. Bath empties Dirty. Lights drops Tired.</div>
</div>
<script>
const outfits = ["none", "cap", "hoodie", "scarf", "bow"];
const toys = ["none", "ball", "duck", "skateboard"];
let pet = fresh();
function fresh() { return { happy: 70, tired: 15, bored: 20, dirty: 10, poop: 0, days: 0, outfit: 0, toy: 0, asleep: false, dead: false, log: "Hatched. Watch the bars." }; }
function clamp(n) { return Math.max(0, Math.min(100, Math.round(n))); }
function act(name) {
  if (pet.dead && name !== "reset") { pet.log = "Dead. Reset to hatch another."; return; }
  if (pet.asleep && name !== "lights" && name !== "reset") { pet.log = "Asleep. Lights to wake it."; return; }
  if (name === "meal") { pet.happy = clamp(pet.happy + 8); pet.tired = clamp(pet.tired + 5); pet.log = "Meal. Happy up a little."; }
  else if (name === "snack") { pet.happy = clamp(pet.happy + 18); pet.dirty = clamp(pet.dirty + 12); pet.log = "Snack. Happy jumps, Dirty rises."; }
  else if (name === "play") { if (!pet.toy) { pet.log = "Give it a toy, then Play."; return; } pet.bored = clamp(pet.bored - 35); pet.happy = clamp(pet.happy + 20); pet.tired = clamp(pet.tired + 15); pet.log = "Play with the " + toys[pet.toy] + ". Bored down, Tired up."; }
  else if (name === "bath") { pet.dirty = 0; pet.poop = 0; pet.happy = clamp(pet.happy + 6); pet.log = "Bath. Dirty and poop cleared."; }
  else if (name === "lights") { pet.asleep = !pet.asleep; if (pet.asleep) pet.tired = clamp(pet.tired - 30); pet.log = pet.asleep ? "Lights off. Tired drops." : "Lights on."; }
  if (pet.dirty > 85 || pet.bored > 90) pet.log += " It looks rough.";
}
function tick() {
  if (pet.dead) return;
  pet.days += 0.05; pet.bored = clamp(pet.bored + 4); pet.dirty = clamp(pet.dirty + 3);
  pet.tired = clamp(pet.tired + (pet.asleep ? -6 : 3)); pet.happy = clamp(pet.happy - 2);
  if (pet.dirty > 60 && Math.random() < 0.35) pet.poop = Math.min(3, pet.poop + 1);
  if (pet.happy < 8 && pet.bored > 90 && pet.dirty > 90) pet.dead = true;
}
function bar(y, name, pct, fill) {
  return `<text x="8" y="${y}" font-family="monospace" font-size="11" fill="#102010">${name}</text><rect x="62" y="${y - 9}" width="92" height="9" fill="#f4ffe8" stroke="#1b3a1a"/><rect x="62" y="${y - 9}" width="${Math.round(pct * 0.92)}" height="9" fill="${fill}"/><text x="160" y="${y}" font-family="monospace" font-size="11" fill="#102010">${pct}</text>`;
}
function svg() {
  const dead = pet.dead, fill = pet.dirty > 70 ? "#7a9a45" : "#5fbf4a";
  const eye = dead ? '<path d="M112 158 l20 16 M132 158 l-20 16 M184 158 l20 16 M204 158 l-20 16" stroke="#1b3a1a" stroke-width="4"/>' : pet.asleep ? '<path d="M112 166 q12 10 24 0 M184 166 q12 10 24 0" fill="none" stroke="#1b3a1a" stroke-width="4"/>' : pet.happy < 40 ? '<ellipse cx="124" cy="170" rx="10" ry="6"/><ellipse cx="196" cy="170" rx="10" ry="6"/>' : '<circle cx="124" cy="166" r="10"/><circle cx="196" cy="166" r="10"/><circle cx="127" cy="163" r="3" fill="#fff"/><circle cx="199" cy="163" r="3" fill="#fff"/>';
  const mouth = dead || pet.happy < 40 ? '<path d="M132 214 q28 -22 56 0" fill="none" stroke="#1b3a1a" stroke-width="5"/>' : '<path d="M132 202 q28 24 56 0" fill="none" stroke="#1b3a1a" stroke-width="5"/>';
  const cloth = ["", '<path d="M96 134 h128 l-14 18 h-100z" fill="#e23d3d" stroke="#1b3a1a"/>', '<path d="M86 186 q74 48 148 0 v28 q-74 24 -148 0z" fill="#355c9a" stroke="#1b3a1a"/>', '<path d="M118 188 q42 14 84 0 q-8 16 -42 16 q-34 0 -42 -16z" fill="#d94f70" stroke="#1b3a1a"/>', '<path d="M214 128 l16 12 -16 12 -16 -12z" fill="#f2c14e" stroke="#1b3a1a"/>'][pet.outfit];
  const toy = ["", '<circle cx="250" cy="214" r="14" fill="#e23d3d" stroke="#1b3a1a"/>', '<ellipse cx="252" cy="214" rx="16" ry="10" fill="#f2c14e" stroke="#1b3a1a"/>', '<rect x="228" y="208" width="42" height="7" fill="#355c9a" stroke="#1b3a1a"/>'][pet.toy];
  let poo = ""; for (let i = 0; i < pet.poop; i++) poo += `<circle cx="${76 + i * 16}" cy="${228 + (i % 2) * 8}" r="8" fill="#6b4f2a" stroke="#1b3a1a"/>`;
  return `<svg viewBox="0 0 320 320">${bar(18,"HAPPY",pet.happy,"#3d9a4a")}${bar(38,"TIRED",pet.tired,"#355c9a")}${bar(58,"BORED",pet.bored,"#e07a5f")}${bar(78,"DIRTY",pet.dirty,"#6b4f2a")}<ellipse cx="160" cy="196" rx="78" ry="58" fill="${fill}" stroke="#1b3a1a" stroke-width="6"/><ellipse cx="118" cy="142" rx="24" ry="28" fill="${fill}" stroke="#1b3a1a" stroke-width="6"/><ellipse cx="202" cy="142" rx="24" ry="28" fill="${fill}" stroke="#1b3a1a" stroke-width="6"/><ellipse cx="160" cy="186" rx="52" ry="36" fill="#c6ef9a"/>${eye}${mouth}${cloth}${toy}${poo}<rect x="70" y="268" width="180" height="32" rx="8" fill="${dead ? "#1a1f22" : "#f4ffe8"}" stroke="#1b3a1a" stroke-width="3"/><text x="160" y="289" text-anchor="middle" font-family="monospace" font-size="14" fill="${dead ? "#f2f2f2" : "#102010"}">${dead ? "DIED DAY" : "ALIVE"} ${Math.floor(pet.days)} DAYS</text></svg>`;
}
function render() {
  document.getElementById("screen").className = "screen" + (pet.dead ? " dead" : pet.asleep ? " asleep" : "");
  document.getElementById("screen").innerHTML = svg();
  document.getElementById("readout").textContent = pet.dead ? "dead" : (pet.asleep ? "asleep" : "awake") + " · poop " + pet.poop;
  document.getElementById("log").textContent = pet.log;
  document.querySelectorAll("[data-outfit]").forEach(b => b.classList.toggle("on", +b.dataset.outfit === pet.outfit));
  document.querySelectorAll("[data-toy]").forEach(b => b.classList.toggle("on", +b.dataset.toy === pet.toy));
}
document.querySelectorAll("[data-act]").forEach(b => b.onclick = () => { if (b.dataset.act === "reset") pet = fresh(); else act(b.dataset.act); render(); });
document.getElementById("clothes").onclick = e => { const t = e.target.closest("[data-outfit]"); if (!t) return; pet.outfit = +t.dataset.outfit; pet.log = "Wearing " + outfits[pet.outfit] + "."; render(); };
document.getElementById("toys").onclick = e => { const t = e.target.closest("[data-toy]"); if (!t) return; pet.toy = +t.dataset.toy; pet.log = pet.toy ? "Holding a " + toys[pet.toy] + ". Now Play." : "Toy put away."; render(); };
setInterval(() => { tick(); render(); }, 1200);
render();
</script>
</body>
</html>
