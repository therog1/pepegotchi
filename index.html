<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pepegotchi</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #142016; color: #172016; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .shell { width: min(94vw, 380px); background: #d7d2c8; border-radius: 42px 42px 64px 64px; padding: 18px 16px 22px; box-shadow: inset 0 0 0 3px #1b1b1b; }
  .brand { text-align: center; font-weight: 800; letter-spacing: 2px; font-size: 13px; margin-bottom: 8px; }
  .screen { background: #9ad07a; border: 6px solid #2c2c2c; border-radius: 16px; padding: 8px; }
  .screen.asleep { background: #1c2430; } .screen.dead { background: #2c3338; }
  svg { width: 100%; height: 300px; display: block; }
  .readout { font-size: 11px; margin-top: 8px; }
  .btns, .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  button { border: 2px solid #1b1b1b; background: #f4f1ea; border-radius: 999px; padding: 8px 10px; font: inherit; font-size: 12px; }
  button.on { background: #1b3a1a; color: #f4ffe8; }
  h2 { font-size: 12px; margin: 14px 0 0; }
  .log { font-size: 12px; line-height: 1.4; min-height: 36px; margin-top: 8px; }
</style>
</head>
<body>
<div class="shell">
  <div class="brand">PEPEGOTCHI</div>
  <div class="screen" id="screen"></div>
  <div class="readout" id="readout"></div>
  <div class="btns">
    <button data-act="meal">Meal</button><button data-act="snack">Snack</button>
    <button data-act="play">Play</button><button data-act="bath">Bath</button>
    <button data-act="lights">Lights</button><button data-act="reset">Reset</button>
  </div>
  <h2>Clothes</h2>
  <div class="row" id="clothes">
    <button data-outfit="0">none</button><button data-outfit="1">cap</button>
    <button data-outfit="2">hoodie</button><button data-outfit="3">scarf</button><button data-outfit="4">bow</button>
  </div>
  <h2>Toys</h2>
  <div class="row" id="toys">
    <button data-toy="0">none</button><button data-toy="1">ball</button>
    <button data-toy="2">duck</button><button data-toy="3">skateboard</button>
  </div>
  <div class="log" id="log">Bars move slowly. Cap sits on the head. Toys sit on the floor.</div>
</div>
<script>
const outfits = ["none","cap","hoodie","scarf","bow"];
const toys = ["none","ball","duck","skateboard"];
let pet = fresh();
function fresh(){return {happy:70,tired:15,bored:20,dirty:8,poop:0,days:0,outfit:0,toy:0,asleep:false,dead:false,log:"Hatched. Bars creep. Buttons move them."}}
function clamp(n){return Math.max(0,Math.min(100,Math.round(n)))}
function act(name){
  if(pet.dead&&name!=="reset"){pet.log="Dead. Reset to hatch another.";return}
  if(pet.asleep&&name!=="lights"&&name!=="reset"){pet.log="Asleep. Lights to wake it.";return}
  if(name==="meal"){pet.happy=clamp(pet.happy+10);pet.log="Meal. Happy +10."}
  else if(name==="snack"){pet.happy=clamp(pet.happy+16);pet.dirty=clamp(pet.dirty+8);pet.log="Snack. Happy up, Dirty +8."}
  else if(name==="play"){if(!pet.toy){pet.log="Give it a toy, then Play.";return}pet.bored=clamp(pet.bored-28);pet.happy=clamp(pet.happy+14);pet.tired=clamp(pet.tired+10);pet.log="Played with the "+toys[pet.toy]+". Bored down."}
  else if(name==="bath"){pet.dirty=0;pet.poop=0;pet.log="Bath. Dirty and poop cleared."}
  else if(name==="lights"){pet.asleep=!pet.asleep;if(pet.asleep)pet.tired=clamp(pet.tired-25);pet.log=pet.asleep?"Lights off. Tired drops.":"Lights on."}
}
function tick(){
  if(pet.dead)return;
  pet.days+=0.02; pet.bored=clamp(pet.bored+1); pet.dirty=clamp(pet.dirty+1);
  pet.tired=clamp(pet.tired+(pet.asleep?-2:1));
  if(pet.bored>60)pet.happy=clamp(pet.happy-1);
  if(pet.dirty>75&&pet.poop<3&&Math.random()<0.25)pet.poop+=1;
  if(pet.happy<5&&pet.bored>95&&pet.dirty>95)pet.dead=true;
}
function clothes(){
  if(pet.outfit===1)return '<path d="M92 132 h136 l-10 16 H102z" fill="#e23d3d" stroke="#1b3a1a" stroke-width="3"/><rect x="96" y="146" width="128" height="8" fill="#e23d3d" stroke="#1b3a1a"/>';
  if(pet.outfit===2)return '<path d="M96 214 q64 36 128 0 v34 q-64 18 -128 0z" fill="#355c9a" stroke="#1b3a1a" stroke-width="3"/><path d="M118 226 h84" stroke="#d7e4f5" stroke-width="3"/>';
  if(pet.outfit===3)return '<path d="M118 208 q42 10 84 0 q-8 14 -42 16 q-34 -2 -42 -16z" fill="#d94f70" stroke="#1b3a1a" stroke-width="3"/><path d="M196 214 q16 18 8 28" fill="none" stroke="#d94f70" stroke-width="6"/>';
  if(pet.outfit===4)return '<path d="M214 128 l14 10 -14 10 -14 -10z" fill="#f2c14e" stroke="#1b3a1a" stroke-width="3"/>';
  return "";
}
function toy(){
  if(pet.toy===1)return '<circle cx="262" cy="248" r="14" fill="#e23d3d" stroke="#1b3a1a" stroke-width="3"/>';
  if(pet.toy===2)return '<ellipse cx="262" cy="250" rx="16" ry="10" fill="#f2c14e" stroke="#1b3a1a" stroke-width="3"/>';
  if(pet.toy===3)return '<rect x="236" y="246" width="46" height="7" rx="2" fill="#355c9a" stroke="#1b3a1a"/><circle cx="246" cy="256" r="4"/><circle cx="272" cy="256" r="4"/>';
  return "";
}
function poop(){let s=""; for(let i=0;i<pet.poop;i++) s+=`<circle cx="${36+i*16}" cy="${252+(i%2)*6}" r="7" fill="#6b4f2a" stroke="#1b3a1a"/>`; return s}
function bar(y,name,pct,fill){return `<text x="8" y="${y}" font-family="monospace" font-size="11" fill="#102010">${name}</text><rect x="62" y="${y-9}" width="92" height="9" fill="#f4ffe8" stroke="#1b3a1a"/><rect x="62" y="${y-9}" width="${Math.round(pct*0.92)}" height="9" fill="${fill}"/><text x="160" y="${y}" font-family="monospace" font-size="11" fill="#102010">${pct}</text>`}
function svg(){
  const dead=pet.dead, fill=pet.dirty>70?"#7a9a45":"#5fbf4a";
  const eye=dead?'<path d="M118 168 l16 14 M134 168 l-16 14 M186 168 l16 14 M202 168 l-16 14" stroke="#1b3a1a" stroke-width="4"/>':pet.asleep?'<path d="M114 174 q12 8 22 0 M184 174 q12 8 22 0" fill="none" stroke="#1b3a1a" stroke-width="4"/>':pet.happy<40?'<ellipse cx="126" cy="176" rx="9" ry="5"/><ellipse cx="194" cy="176" rx="9" ry="5"/>':'<circle cx="126" cy="172" r="9"/><circle cx="194" cy="172" r="9"/><circle cx="129" cy="169" r="3" fill="#fff"/><circle cx="197" cy="169" r="3" fill="#fff"/>';
  const mouth=dead||pet.happy<40?'<path d="M138 198 q22 -16 44 0" fill="none" stroke="#1b3a1a" stroke-width="5"/>':'<path d="M138 194 q22 18 44 0" fill="none" stroke="#1b3a1a" stroke-width="5"/>';
  return `<svg viewBox="0 0 320 340">${bar(18,"HAPPY",pet.happy,"#3d9a4a")}${bar(36,"TIRED",pet.tired,"#355c9a")}${bar(54,"BORED",pet.bored,"#e07a5f")}${bar(72,"DIRTY",pet.dirty,"#6b4f2a")}${clothes()}<ellipse cx="160" cy="214" rx="70" ry="48" fill="${fill}" stroke="#1b3a1a" stroke-width="6"/><ellipse cx="118" cy="156" rx="22" ry="26" fill="${fill}" stroke="#1b3a1a" stroke-width="6"/><ellipse cx="202" cy="156" rx="22" ry="26" fill="${fill}" stroke="#1b3a1a" stroke-width="6"/><ellipse cx="160" cy="200" rx="46" ry="32" fill="#c6ef9a"/>${eye}${mouth}${toy()}${poop()}<rect x="78" y="292" width="164" height="30" rx="8" fill="${dead?"#1a1f22":"#f4ffe8"}" stroke="#1b3a1a" stroke-width="3"/><text x="160" y="312" text-anchor="middle" font-family="monospace" font-size="13" fill="${dead?"#f2f2f2":"#102010"}">${dead?"DIED DAY":"ALIVE"} ${Math.floor(pet.days)} DAYS</text></svg>`;
}
function render(){
  document.getElementById("screen").className="screen"+(pet.dead?" dead":pet.asleep?" asleep":"");
  document.getElementById("screen").innerHTML=svg();
  document.getElementById("readout").textContent=(pet.dead?"dead":pet.asleep?"asleep":"awake")+" · poop "+pet.poop;
  document.getElementById("log").textContent=pet.log;
  document.querySelectorAll("[data-outfit]").forEach(b=>b.classList.toggle("on",+b.dataset.outfit===pet.outfit));
  document.querySelectorAll("[data-toy]").forEach(b=>b.classList.toggle("on",+b.dataset.toy===pet.toy));
}
document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{if(b.dataset.act==="reset")pet=fresh();else act(b.dataset.act);render()});
document.getElementById("clothes").onclick=e=>{const t=e.target.closest("[data-outfit]");if(!t)return;pet.outfit=+t.dataset.outfit;pet.log="Wearing "+outfits[pet.outfit]+".";render()};
document.getElementById("toys").onclick=e=>{const t=e.target.closest("[data-toy]");if(!t)return;pet.toy=+t.dataset.toy;pet.log=pet.toy?"Toy on the floor: "+toys[pet.toy]+".":"Toy put away.";render()};
setInterval(()=>{tick();render()},4000);
render();
</script>
</body>
</html>
